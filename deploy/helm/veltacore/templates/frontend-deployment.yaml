apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: { app: veltacore, component: frontend }
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels: { app: veltacore, component: frontend }
  template:
    metadata:
      labels: { app: veltacore, component: frontend }
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          ports: [{ containerPort: 80 }]
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector: { app: veltacore, component: frontend }
  ports: [{ port: 80, targetPort: 80 }]
