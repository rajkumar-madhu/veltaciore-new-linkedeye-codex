apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: { app: veltacore, component: api }
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels: { app: veltacore, component: api }
  template:
    metadata:
      labels: { app: veltacore, component: api }
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-env }
            - secretRef: { name: {{ .Values.postgres.existingSecret }} }
          readinessProbe:
            httpGet: { path: /api/tenants/, port: 8000 }
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app: veltacore, component: api }
  ports: [{ port: 8000, targetPort: 8000 }]
