image:
  api: veltacore/api:1.0.0
  frontend: veltacore/frontend:1.0.0
  pullPolicy: IfNotPresent

replicas:
  api: 2
  worker: 2
  frontend: 2

ingress:
  enabled: true
  className: nginx
  host: veltacore.example.com
  tls: true

postgres:
  host: postgres
  port: 5432
  db: veltacore
  user: veltacore
  existingSecret: veltacore-db

redis:
  url: redis://redis:6379/0

keycloak:
  serverUrl: http://keycloak:8080
  realm: veltacore
  clientId: veltacore-api

opa:
  url: http://opa:8181/v1/data/veltacore/authz/allow
  failOpen: false

resources:
  api:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  worker:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  frontend:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
